name: Curriculum integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Compile repository tooling
        run: python -m py_compile scripts/csf.py scripts/repo_audit.py

      - name: Run repository self-tests
        run: python -m unittest discover -s tests -v

      - name: Verify generated views and repository integrity
        run: python scripts/csf.py audit --strict
